; PlatformIO wrapper — uses existing ESP-IDF CMake layout
[platformio]
src_dir = main

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
extra_scripts = pre:disable_usj.py
build_unflags =
    -DCONFIG_ESP_CONSOLE_USB_SERIAL_JTAG
build_flags =
    -DCONFIG_ESP_CONSOLE_UART_DEFAULT=1
