; PlatformIO wrapper — uses existing ESP-IDF CMake layout
; Flash size: pick an env that matches the module (docs/flashing.md §4.0).
;   pio run -e flash_4mb|flash_8mb|flash_16mb
; tools/flash_handheld.sh auto-detects the chip and selects the matching env.
[platformio]
src_dir = main
default_envs = flash_8mb

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
build_flags =
    -DCONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=1

; Original Controller-RevB module (N8R2). Also alias name "esp32s3".
[env:flash_8mb]
board_upload.flash_size = 8MB
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.flash.8mb

[env:esp32s3]
extends = env:flash_8mb

; N4R8 / 4MB flash modules
[env:flash_4mb]
board_upload.flash_size = 4MB
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.flash.4mb

; 16MB flash modules
[env:flash_16mb]
board_upload.flash_size = 16MB
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.flash.16mb
